# Render Blueprint: New + > Blueprint > pick this repo. Free web service + free Postgres.
services:
  - type: web
    name: foodloop-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@foodloop.local      # change to your own email
      - key: ADMIN_PASSWORD
        generateValue: true              # read it in the Render dashboard (Environment tab)
      - key: OSRM_URL
        value: https://router.project-osrm.org   # public demo router; set empty to disable road routing
      - key: DATABASE_URL
        fromDatabase: { name: foodloop-db, property: connectionString }
databases:
  - name: foodloop-db
    plan: free
